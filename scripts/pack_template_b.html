<!doctype html>
<!--
  SPADRA pack image master template — torn-sachet flat lay.

  A light surface, the day's actives spilled out, and a dark sachet entering
  from the bottom edge with its top torn open. The sachet carries the SPADRA
  wordmark, the protocol name and a day/night mark.

  Rendered headless by scripts/render_packs.py at 1200x1200. Placeholders are
  substituted server-side (double-brace tokens) — no JavaScript, no network
  fetch. Pill shape and colour come from the product's actual actives, and
  scatter positions come from a seed derived from the product id, so a given
  product renders byte-identically every time while still looking individual.
  The sha256 of this file is the template_hash in the registry: change this file
  and every pack is correctly marked for regeneration.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 1200px;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(115% 82% at 50% 20%, #FBFAF8 0%, #F5F3EF 58%, #EDEAE4 100%);
    font-family: "Liberation Sans", "DejaVu Sans", sans-serif;
  }

  /* ---- spilled actives ---- */
  .pill { position: absolute; }
  .pill i {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    box-shadow:
      0 16px 24px -12px rgba(62, 54, 42, 0.36),
      0 2px 5px rgba(62, 54, 42, 0.12);
    overflow: hidden;
  }

  /* two-piece capsule: coloured cap over a lighter body */
  .pill.cap i {
    background: linear-gradient(180deg,
      var(--cap) 0%, var(--cap) 47%,
      var(--body) 47.5%, var(--body) 100%);
  }
  .pill.cap i::after {
    content: "";
    position: absolute;
    top: 7%; left: 15%;
    width: 20%; height: 86%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.58), rgba(255,255,255,0.05));
  }

  /* softgel: translucent, single colour, wet highlight */
  .pill.gel i {
    background:
      radial-gradient(66% 58% at 32% 26%, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0) 48%),
      var(--body);
  }

  /* pressed tablet: round, matte, lightly speckled */
  .pill.tab i {
    border-radius: 50%;
    background:
      radial-gradient(58% 52% at 36% 30%, rgba(255,255,255,0.60), rgba(255,255,255,0) 60%),
      var(--body);
  }
  .pill.tab i::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.28;
    background-image:
      radial-gradient(1.7px 1.7px at 30% 62%, rgba(110,92,80,0.9), transparent 60%),
      radial-gradient(1.5px 1.5px at 66% 36%, rgba(110,92,80,0.8), transparent 60%),
      radial-gradient(1.6px 1.6px at 52% 74%, rgba(110,92,80,0.75), transparent 60%),
      radial-gradient(1.4px 1.4px at 73% 67%, rgba(110,92,80,0.7), transparent 60%);
  }

  /* clear capsule packed with granules */
  .pill.clear i {
    background:
      radial-gradient(62% 52% at 30% 24%, rgba(255,255,255,0.88), rgba(255,255,255,0) 54%),
      repeating-linear-gradient(118deg,
        var(--cap) 0 3px,
        var(--body) 3px 6px);
    border: 1px solid rgba(255,255,255,0.55);
  }

  /* ---- torn sachet, entering from the bottom edge ---- */
  .sachet {
    position: absolute;
    left: 50%;
    margin-left: -330px;
    bottom: 0;
    width: 660px;
    height: 452px;
    background: linear-gradient(171deg, #1A2434 0%, #0E1624 46%, #070C15 100%);
    filter: drop-shadow(0 -22px 46px rgba(40, 36, 30, 0.42));
    clip-path: polygon({{TEAR}});
    padding: 104px 58px 0;
  }
  /* fibrous shadow just under the torn lip */
  .sachet::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 74px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 72%);
    pointer-events: none;
  }

  .wordmark {
    font-family: "Bitstream Charter", "Liberation Serif", "DejaVu Serif", serif;
    font-size: 60px;
    font-weight: 700;
    letter-spacing: 0.17em;
    text-indent: 0.17em;
    color: #FFFFFF;
    line-height: 1;
  }

  .row {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .name {
    font-size: 30px;
    line-height: 1.24;
    color: rgba(255,255,255,0.68);
    max-width: 420px;
  }
  .name.is-long { font-size: 25px; }
  .name.is-xlong { font-size: 21px; }

  .when {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.30);
    display: flex; align-items: center; justify-content: center;
  }

  .category {
    position: absolute;
    left: 56px;
    bottom: 46px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.42);
  }
</style>
</head>
<body>
  {{CAPSULES}}

  <div class="sachet">
    <div class="wordmark">SPADRA</div>
    <div class="row">
      <div class="name {{NAME_CLASS}}">{{TITLE}}</div>
      <div class="when">{{ICON}}</div>
    </div>
    <div class="category">{{CATEGORY}} &middot; {{QTY}} DAILY PACKS</div>
  </div>
</body>
</html>
